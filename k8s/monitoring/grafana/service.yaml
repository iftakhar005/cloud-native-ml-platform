# Cluster-internal only; reach it with `kubectl port-forward` (127.0.0.1). A login exists,
# but a published Grafana is a login page on the internet, and that is a decision for the
# public-hosting step, not something to open by default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
