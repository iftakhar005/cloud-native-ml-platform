# Cluster-internal only. Prometheus has no login, so it is never published outside the
# cluster; you reach its UI with `kubectl port-forward`, which listens on 127.0.0.1.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
