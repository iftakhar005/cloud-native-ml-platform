apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: thikana-monitoring
spec:
  replicas: 1                      # one writer for the time-series database
  strategy:
    type: Recreate                 # never two Prometheus processes at once during an update
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: thikana-monitoring
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true   # NEEDED: pod discovery calls the Kubernetes API
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534           # "nobody"; the image's own default
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prometheus        # registry, tag and digest are pinned in kustomization.yaml
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h     # a day of history is plenty for a laptop
            - --storage.tsdb.retention.size=1GB
            - --web.listen-address=:9090
            # Deliberately NOT --web.enable-lifecycle or --web.enable-admin-api: with no login
            # in front of Prometheus, those would let anyone who can reach it reload config
            # or delete data. A config change rolls the pod (the ConfigMap name is hashed).
          ports:
            - name: http
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi        # measured: 79 MiB with 4 targets and a day of retention
            limits:
              cpu: "1"
              memory: 512Mi        # 6x what it uses; memory grows with the number of series, not traffic
          startupProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config    # generated; kustomize rewrites this to the hashed name
        - name: data
          emptyDir:
            sizeLimit: 2Gi             # NOT persistent: history is lost when the pod is replaced
