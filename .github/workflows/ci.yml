# CI for Thikana. See docs/ci.md for what each step proves and what it does not.
#
#   verify  test -> train -> quality gate           (read-only token)
#   image   build -> smoke test -> Trivy -> push    (only this job can write packages)
#   deploy  OPTIONAL, OFF by default: tell Render to run the image just published
#
# By default nothing here deploys anything. A GitHub-hosted runner cannot reach a cluster
# running on a laptop, so the pipeline ends at "a scanned image with a git-SHA tag exists in
# GHCR". The `deploy` job exists for a CLOUD host (Render's free tier, docs/public-hosting.md)
# and does nothing until the repository variable RENDER_DEPLOY_ENABLED is set to `true`.
#
# SUPPLY CHAIN: every action is pinned to a full commit SHA (a tag can be moved, a SHA
# cannot), and the scanner is the Trivy container image pinned by digest, deliberately
# NOT aquasecurity/trivy-action, whose version tags were force-pushed to malicious commits
# in March 2026. The comment after each pin names the release it corresponds to.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default for every job: read the repository, nothing else. A job that needs more asks
# for it by name below.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: thikana-api
  # Pinned by tag AND digest. Version 0.76.1 is the one this project's findings were
  # produced with; the digest guarantees the bytes.
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  verify:
    name: test, train, quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # do not leave the token in .git/config for later steps

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"       # same minor version as the Docker base image
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Unit and API tests
        run: python -m pytest -q

      # models/ is gitignored, so the model is built here from the committed gazetteer.
      - name: Train the production model
        run: python -m thikana.training.train_all

      # The .crfsuite bytes differ between Windows and Linux (checked), so the test is
      # behaviour on the hand-written sets, not a hash. Fails the job on a regression.
      - name: Quality gate
        run: python -m thikana.training.gate

      # Hand the exact files that passed the gate to the next job, so the image contains
      # the gated model and not a second, ungated retraining.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-model
          path: |
            models/crf_all_district_memory_vocab.crfsuite
            models/crf_all_district_memory_vocab.json
          if-no-files-found: error
          retention-days: 7

  image:
    name: build, scan, publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write    # lets the built-in GITHUB_TOKEN push to ghcr.io/<owner>/ ; see docs/ci.md
    outputs:
      digest_ref: ${{ steps.publish.outputs.digest_ref }}   # ghcr.io/<owner>/thikana-api@sha256:..., for `deploy`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-model
          path: models

      - name: Name the image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"            # registries require lowercase
          echo "IMAGE=ghcr.io/${owner}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          ls -l models

      # The tag is the full commit SHA: immutable, and `git checkout <tag>` reproduces the
      # code. The same SHA is baked in (GIT_SHA), so GET /api/v1/model reports it.
      # The source label is what lets GitHub link the package to this repository.
      - name: Build
        run: |
          docker build \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}" .
          docker image ls "${IMAGE}"

      # Run the image the way Kubernetes will (non-root, read-only, no capabilities) and
      # ask it a real question. Catches "builds fine, crashes as the app user".
      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8000:8000 --read-only --cap-drop ALL \
            --security-opt no-new-privileges "${IMAGE}"
          curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:8000/readyz > /dev/null
          reply=$(curl --silent --show-error --fail -H 'Content-Type: application/json' \
            -d '{"text": "House 12, Road 5, Mirpur-10, Dhaka-1216"}' \
            http://127.0.0.1:8000/api/v1/parse)
          echo "$reply" | jq -c .fields
          test "$(echo "$reply" | jq -r '.fields.postcode[0]')" = "1216"
          served=$(curl --silent --show-error --fail http://127.0.0.1:8000/api/v1/model | jq -r .git_sha)
          echo "baked-in git sha: ${served}"
          test "${served}" = "${GITHUB_SHA}"
          test "$(docker inspect --format '{{.Config.User}}' smoke)" = "10001:10001"

      # The same image as it will run on a public host: public mode on, same strict flags. The
      # cluster needs /metrics, /docs and the instance name; the open internet must not see them.
      # NOTE the `if ...; then exit 1; fi` for the "must be absent" check: under `bash -e` a command
      # negated with `!` never fails the script, so `! grep ...` would pass even when the header leaks.
      - name: Smoke test public mode
        run: |
          docker run -d --name smoke-public -p 8001:8000 --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            -e THIKANA_PUBLIC_MODE=true -e THIKANA_RATE_LIMIT_PER_MINUTE=60 "${IMAGE}"
          curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:8001/readyz > /dev/null
          status() { curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8001$1"; }
          test "$(status /)" = "200"
          test "$(status /assets/app.js)" = "200"
          test "$(status /metrics)" = "404"
          test "$(status /docs)" = "404"
          test "$(status /openapi.json)" = "404"
          curl --silent --show-error --fail http://127.0.0.1:8001/ | grep -q "Thikana"
          headers=$(curl --silent --dump-header - --output /dev/null http://127.0.0.1:8001/)
          echo "$headers" | grep -qi '^content-security-policy:'
          if echo "$headers" | grep -qi '^x-thikana-instance:'; then
            echo "public mode leaks the instance name"; exit 1
          fi

      - name: Dump container logs if a smoke test failed
        if: failure()
        run: |
          docker logs smoke || true
          docker logs smoke-public || true

      - name: Export image for scanning
        run: docker save "${IMAGE}" -o "${RUNNER_TEMP}/image.tar"

      # Everything Trivy knows, all severities, never fails. For the record, not the gate.
      - name: Vulnerability report (informational)
        run: |
          docker run --rm -v "${RUNNER_TEMP}:/work" "${TRIVY_IMAGE}" image \
            --input /work/image.tar --scanners vuln --quiet \
            --format json --output /work/trivy-report.json
          {
            echo "### Trivy findings, all severities (informational)"
            echo
            echo "| severity | total | with a fix available |"
            echo "|---|---|---|"
            for s in CRITICAL HIGH MEDIUM LOW UNKNOWN; do
              jq -r --arg s "$s" '[.Results[]?.Vulnerabilities[]? | select(.Severity==$s)] |
                "| \($s) | \(length) | \(map(select(.FixedVersion)) | length) |"' "${RUNNER_TEMP}/trivy-report.json"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # THE GATE. Fails the job (exit 1) on any HIGH or CRITICAL finding that has a fix
      # available. Unfixed ones are shown in the report above but cannot block a build:
      # nothing the project can do removes them, other than switching base image.
      - name: Trivy gate (HIGH/CRITICAL with a fix available)
        run: |
          docker run --rm -v "${RUNNER_TEMP}:/work" "${TRIVY_IMAGE}" image \
            --input /work/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      # Only after every step above passed, and only for a push to main (never a pull
      # request). The token is given to this one step, not to the whole job.
      - name: Publish to GHCR
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}"
          docker logout ghcr.io
          digest_ref=$(docker image inspect "${IMAGE}" --format '{{index .RepoDigests 0}}')
          # Exactly one shape is ever passed on: <registry>/<name>@sha256:<64 hex digits>.
          if ! echo "${digest_ref}" | grep -Eq '^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$'; then
            echo "unexpected digest reference: ${digest_ref}"; exit 1
          fi
          echo "digest_ref=${digest_ref}" >> "$GITHUB_OUTPUT"
          {
            echo "### Published"
            echo
            echo '```'
            echo "${IMAGE}"
            echo "${digest_ref}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- OPTIONAL, OFF BY DEFAULT: deploy the image just published to Render ------------------
  # Runs only when ALL of these hold: a push to main, the `image` job succeeded, and the
  # repository VARIABLE RENDER_DEPLOY_ENABLED is exactly `true` (Settings > Secrets and
  # variables > Actions > Variables). Merging this changes nothing until you set it.
  #
  # Why it is built this way:
  #  * No `uses:` at all: no third-party action can ever see the secret. Only one curl runs.
  #  * `permissions: {}`: it needs nothing from GitHub, so it gets nothing.
  #  * The secret reaches only the one step that needs it, through `env`, and is never printed;
  #    the step reports an HTTP status, not the URL.
  #  * It deploys the DIGEST CI just pushed, never a tag that could be moved. Render's deploy
  #    hook accepts `imgURL` for an image-backed service as long as everything except the tag or
  #    digest matches the service's own image (docs: https://render.com/docs/deploy-hooks).
  #  * The hook URL is itself a secret ("Your deploy hook URL is a secret!"): anyone holding it
  #    can trigger a deploy of that service. It can only choose among images of the SAME name.
  #    If it leaks, "Regenerate Hook" in Render and update the GitHub secret.
  # Rollback needs no CI: Render > Deploys > Rollback, or call the hook with an older digest.
  deploy:
    name: deploy to Render (optional)
    needs: image
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ask Render to run this exact image
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE_REF: ${{ needs.image.outputs.digest_ref }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_ENABLED is true but the RENDER_DEPLOY_HOOK secret is empty"; exit 1
          fi
          if ! echo "${IMAGE_REF}" | grep -Eq '^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$'; then
            echo "refusing to deploy anything that is not a ghcr.io digest reference"; exit 1
          fi
          # --get --data-urlencode: curl URL-encodes imgURL itself and appends it to the hook URL,
          # which already carries ?key=..., so there is no hand-written encoding or ?/& logic.
          status=$(curl --silent --show-error --max-time 30 --output /dev/null \
            --write-out '%{http_code}' --request POST \
            --get --data-urlencode "imgURL=${IMAGE_REF}" "${RENDER_DEPLOY_HOOK}")
          # 200 = deploy started, 202 = another deploy is running and this one is queued (Render docs).
          case "${status}" in
            200|202) echo "Render accepted the deploy (HTTP ${status})" ;;
            *) echo "Render answered HTTP ${status}; nothing was deployed"; exit 1 ;;
          esac
          {
            echo "### Asked Render to deploy"
            echo
            echo '```'
            echo "${IMAGE_REF}   (HTTP ${status})"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
